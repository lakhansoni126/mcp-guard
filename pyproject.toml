[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcpguard"
version = "0.1.0"
description = "Approve or block every MCP request from Claude Desktop and Claude Web"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []  # standard library only (tkinter ships with python.org builds)

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mcpguard = "mcpguard.__main__:main"

[tool.setuptools]
packages = ["mcpguard"]
